[package]
name = "courierust_benchmark"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["blueokanna", "HyphenTeam"]
description = "no_std HTTP/1+2/gRPC engine with work-stealing, RFC 9218, and JA3/JA4 fingerprinting benchmark"
readme = "README.md"
keywords = ["http2", "network", "client", "no-std", "multicore"]
categories = [
    "network-programming",
    "web-programming::http-client",
    "web-programming::http-server",
]

[dependencies]
courierust = { path = "../" }

# Mainstream comparison targets.
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "client", "server", "full"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server-auto",
    "client-legacy",
] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "http2"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net"] }

[[bench]]
name = "throughput"
harness = false
path = "src/throughput.rs"

[[bench]]
name = "compare"
harness = false
path = "src/compare.rs"

[[bench]]
name = "concurrency"
harness = false
path = "src/concurrency.rs"

[[bench]]
name = "interop"
harness = false
path = "src/interop.rs"

[[bench]]
name = "network"
harness = false
path = "src/network.rs"

[[bench]]
name = "tls_interop"
harness = false
path = "src/tls_interop.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
