[package]
name = "courierust_benchmark"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["blueokanna", "HyphenTeam"]
description = "no_std HTTP/1+2/gRPC engine with work-stealing, RFC 9218, and JA3/JA4 fingerprinting benchmark"
readme = "README.md"
keywords = ["http2", "network", "client", "no-std", "multicore"]
categories = [
    "network-programming",
    "web-programming::http-client",
    "web-programming::http-server",
]

[dependencies]
courierust = { path = "../" }

# Mainstream comparison targets.
bytes = "1"
http-body-util = "0.1"
h3 = "0.0"
h3-quinn = "0.0"
http = "1"
hyper = { version = "1", features = ["http1", "http2", "client", "server", "full"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server-auto",
    "client-legacy",
] }
quinn = "0.11"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "http2"] }
rustls = "0.23"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros"] }
tokio-rustls = "0.26"

[[bench]]
name = "throughput"
harness = false
path = "src/throughput.rs"

[[bench]]
name = "compare"
harness = false
path = "src/compare.rs"

[[bench]]
name = "concurrency"
harness = false
path = "src/concurrency.rs"

[[bench]]
name = "interop"
harness = false
path = "src/interop.rs"

[[bench]]
name = "network"
harness = false
path = "src/network.rs"

[[bench]]
name = "tls_peer"
harness = false
path = "src/tls_peer.rs"

[[bench]]
name = "quinn_dbg"
harness = false
path = "src/quinn_dbg.rs"

[[bench]]
name = "tmp_repro"
harness = false
path = "src/tmp_repro.rs"

[[bench]]
name = "h3"
harness = false
path = "src/h3.rs"

[[bench]]
name = "tls_interop"
harness = false
path = "src/tls_interop.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
