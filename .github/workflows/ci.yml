name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Github_Action_Benchmark.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.78.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy — std (all targets, warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy — no_std protocol core
        run: cargo clippy --locked --no-default-features --lib -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
      - uses: Swatinem/rust-cache@v2
      - name: Root lockfile is compatible with the MSRV
        run: cargo metadata --locked --format-version 1
      - name: Build — std (all targets)
        run: cargo build --locked --all-targets
      - name: Build — no_std protocol core
        run: cargo build --locked --no-default-features --lib
      - name: Run tests (unit + integration)
        run: cargo test --locked --all-targets
      - name: Repeat Windows pooled-connection regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifacts = cargo test --locked --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaries = @($artifacts | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object {
              $_.reason -eq 'compiler-artifact' -and
              $_.target.name -eq 'courierust' -and
              $_.profile.test -and $_.executable
            })
          if ($binaries.Count -ne 1) { throw 'Expected one library test executable.' }
          $case = 'courierust_client::tests::h1_client_probes_a_pooled_connection_before_reusing_it'
          for ($iteration = 1; $iteration -le 100; $iteration++) {
            $result = & $binaries[0].executable --exact $case 2>&1
            # --exact also exits successfully when the test name matches nothing.
            if ($LASTEXITCODE -ne 0 -or
                -not ($result -match '^test result: ok\. 1 passed; 0 failed; 0 ignored;')) {
              $result | Write-Output
              throw "Pooled-connection regression failed on iteration $iteration."
            }
          }
          Write-Output 'Pooled-connection regression passed 100 consecutive runs.'
      - name: Run doc tests
        run: cargo test --locked --doc

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
      - uses: Swatinem/rust-cache@v2
      - name: Build rustdoc (missing-docs is on)
        run: cargo doc --locked --no-deps

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -config-file .github/actionlint.yaml

  satellite-workspaces:
    name: bench/fuzz workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            benches -> benches/target
            fuzz -> fuzz/target
      - name: Root workspace lockfile is in sync
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Bench workspace lockfile is in sync
        run: cargo metadata --manifest-path benches/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Fuzz workspace lockfile is in sync
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Bench workspace is rustfmt-clean
        run: cargo fmt --manifest-path benches/Cargo.toml -- --check
      - name: Bench workspace is clippy-clean (warnings are errors)
        run: cargo clippy --manifest-path benches/Cargo.toml --locked --all-targets -- -D warnings
      - name: Benchmark measurement regressions
        run: cargo test --manifest-path benches/Cargo.toml --locked --lib
      - name: Fuzz workspace compiles
        run: cargo check --manifest-path fuzz/Cargo.toml --locked --all-targets
