name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README_CN.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy — std (all targets, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy — no_std protocol core
        run: cargo clippy --no-default-features --lib -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
      - uses: Swatinem/rust-cache@v2
      - name: Build — std (all targets)
        run: cargo build --all-targets
      - name: Build — no_std protocol core
        run: cargo build --no-default-features --lib
      - name: Run tests (unit + integration)
        run: cargo test --all-targets
      - name: Run doc tests
        run: cargo test --doc

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
      - uses: Swatinem/rust-cache@v2
      - name: Build rustdoc (missing-docs is on)
        run: cargo doc --no-deps
