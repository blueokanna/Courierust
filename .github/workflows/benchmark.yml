name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: throughput + compare (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - name: Run throughput benchmarks
        id: bench
        run: |
          cargo bench --manifest-path benches/Cargo.toml --bench throughput 2>&1 | tee bench.log
      - name: Run comparison benchmarks (vs hyper / reqwest / tiny_http)
        run: |
          cargo bench --manifest-path benches/Cargo.toml --bench compare 2>&1 | tee -a bench.log
      - name: Summarize results
        run: |
          echo "## Courierust benchmarks (release, \${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -E "(req/s| ms |allocs/req)" bench.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
