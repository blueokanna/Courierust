name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: throughput (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        id: bench
        run: |
          cargo bench --bench throughput 2>&1 | tee bench.log
      - name: Summarize results
        run: |
          echo "## Courierust benchmarks (release, \${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -E "(req/s| ms )" bench.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
