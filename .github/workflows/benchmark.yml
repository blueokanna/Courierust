name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmark.yml'
      - 'scripts/generate_benchmark_report.sh'
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/benchmark.yml'
      - 'scripts/generate_benchmark_report.sh'
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: throughput + compare (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - name: Run benchmarks + interop validation
        id: benchmarks
        shell: bash
        run: |
          set +e
          set -o pipefail

          cargo bench --manifest-path benches/Cargo.toml --locked --bench throughput 2>&1 | tee throughput.log
          throughput_status=${PIPESTATUS[0]}

          cargo bench --manifest-path benches/Cargo.toml --locked --bench compare 2>&1 | tee compare.log
          compare_status=${PIPESTATUS[0]}

          cargo bench --manifest-path benches/Cargo.toml --locked --bench interop 2>&1 | tee interop.log
          interop_status=${PIPESTATUS[0]}

          printf 'throughput_exit=%s\n' "$throughput_status" >> "$GITHUB_OUTPUT"
          printf 'compare_exit=%s\n' "$compare_status" >> "$GITHUB_OUTPUT"
          printf 'interop_exit=%s\n' "$interop_status" >> "$GITHUB_OUTPUT"

          if [[ "$throughput_status" -ne 0 || "$compare_status" -ne 0 || "$interop_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Generate Github_Action_Benchmark.md
        if: always()
        env:
          BENCHMARK_THROUGHPUT_EXIT: ${{ steps.benchmarks.outputs.throughput_exit }}
          BENCHMARK_COMPARE_EXIT: ${{ steps.benchmarks.outputs.compare_exit }}
          BENCHMARK_INTEROP_EXIT: ${{ steps.benchmarks.outputs.interop_exit }}
        run: |
          bash scripts/generate_benchmark_report.sh \
            throughput.log \
            compare.log \
            interop.log \
            Github_Action_Benchmark.md

      - name: Publish benchmark report to the run summary
        if: always()
        shell: bash
        run: |
          if [[ -f Github_Action_Benchmark.md ]]; then
            cat Github_Action_Benchmark.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Github_Action_Benchmark.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Github_Action_Benchmark
          path: |
            Github_Action_Benchmark.md
            throughput.log
            compare.log
            interop.log
          if-no-files-found: error
