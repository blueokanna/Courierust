name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmark.yml'
      - 'scripts/generate_benchmark_report.sh'
      - 'src/**'
      - 'benches/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/benchmark.yml'
      - 'scripts/generate_benchmark_report.sh'
      - 'src/**'
      - 'benches/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: All benchmarks (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - name: Run benchmarks + interop validation
        id: benchmarks
        shell: bash
        env:
          COURIERUST_NETWORK_URL: ${{ secrets.COURIERUST_REMOTE_URL }}
          # Env-gated H3 diagnostics: printed only on error/cold paths, so
          # a future connection-close failure carries the server's reason
          # straight into the captured log instead of a bare "peer closed
          # HTTP/3".
          COURIERUST_H3_DEBUG: 1
        run: |
          suite_failed=0

          run_suite() {
            local suite=$1
            local log=$2
            shift 2

            local command_status
            local log_status

            if "$@" > "$log" 2>&1; then
              command_status=0
            else
              command_status=$?
            fi

            if cat "$log"; then
              log_status=0
            else
              log_status=$?
            fi
            printf '%s_exit=%s\n' "$suite" "$command_status" >> "$GITHUB_OUTPUT"

            if [[ "$command_status" -ne 0 || "$log_status" -ne 0 ]]; then
              printf '::error title=Benchmark %s failed::command exit=%s, log capture exit=%s; inspect %s\n' \
                "$suite" "$command_status" "$log_status" "$log" >&2
              suite_failed=1
            fi
          }

          run_suite throughput throughput.log \
            cargo bench --manifest-path benches/Cargo.toml --locked --bench throughput
          run_suite compare compare.log \
            cargo bench --manifest-path benches/Cargo.toml --locked --bench compare
          run_suite concurrency concurrency.log \
            cargo bench --manifest-path benches/Cargo.toml --locked --bench concurrency
          run_suite interop interop.log \
            cargo bench --manifest-path benches/Cargo.toml --locked --bench interop
          run_suite h3 h3.log \
            cargo bench --manifest-path benches/Cargo.toml --locked --bench h3

          if [[ -n "${COURIERUST_NETWORK_URL:-}" ]]; then
            run_suite network network.log \
              cargo bench --manifest-path benches/Cargo.toml --locked --bench network
          else
            printf 'NETWORK|role=client|status=not_configured|target_scope=remote|reason=COURIERUST_REMOTE_URL_not_set\n' > network.log
            printf 'network_exit=not-configured\n' >> "$GITHUB_OUTPUT"
          fi

          if [[ "$suite_failed" -ne 0 ]]; then
            exit 1
          fi

      - name: Run fuzz targets
        id: fuzz
        if: always()
        shell: bash
        run: |
          set +e
          fuzz_failed=0
          : > fuzz.log
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
          # PR-time smoke fuzz: each target gets a short wall-clock budget
          # (20 s) rather than a fixed run count. It is a smoke check for
          # gross crashes, not deep state-machine exploration — the
          # long-running workflow (fuzz-long.yml) spends 30-120 minutes
          # per target on the nightly schedule.
          # h2_frame / hpack_block: legacy targets. h1_request: the
          # shared HTTP/1 request path (request line, headers, chunked
          # framing) that both the blocking and event-driven parsers use.
          # h2_connection: the full h2 state machine driven by hostile
          # frame streams (client and server roles).
          for target in h2_frame hpack_block h1_request h2_connection; do
            started=$(date +%s)
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- -max_total_time=20 -max_len=16384 -timeout=10 -rss_limit_mb=2048 >> fuzz.log 2>&1
            command_status=$?
            duration=$(( $(date +%s) - started ))
            if [[ "$command_status" -eq 0 ]]; then
              status=ok
            else
              status=failed
              fuzz_failed=1
            fi
            printf 'FUZZ|target=%s|status=%s|runs=smoke|duration_s=%s|corpus=fuzz/corpus/%s|reason=command_exit_%s\n' \
              "$target" "$status" "$duration" "$target" "$command_status" >> fuzz.log
          done
          cat fuzz.log
          printf 'fuzz_exit=%s\n' "$fuzz_failed" >> "$GITHUB_OUTPUT"
          exit "$fuzz_failed"

      - name: Generate Github_Action_Benchmark.md
        if: always()
        env:
          BENCHMARK_THROUGHPUT_EXIT: ${{ steps.benchmarks.outputs.throughput_exit }}
          BENCHMARK_COMPARE_EXIT: ${{ steps.benchmarks.outputs.compare_exit }}
          BENCHMARK_CONCURRENCY_EXIT: ${{ steps.benchmarks.outputs.concurrency_exit }}
          BENCHMARK_INTEROP_EXIT: ${{ steps.benchmarks.outputs.interop_exit }}
          BENCHMARK_H3_EXIT: ${{ steps.benchmarks.outputs.h3_exit }}
          BENCHMARK_NETWORK_EXIT: ${{ steps.benchmarks.outputs.network_exit }}
          BENCHMARK_FUZZ_EXIT: ${{ steps.fuzz.outputs.fuzz_exit }}
          COURIERUST_REMOTE_URL: ${{ secrets.COURIERUST_REMOTE_URL }}
        run: |
          bash scripts/generate_benchmark_report.sh \
            throughput.log \
            compare.log \
            concurrency.log \
            interop.log \
            network.log \
            fuzz.log \
            h3.log \
            Github_Action_Benchmark.md

      - name: Publish benchmark report to the run summary
        if: always()
        shell: bash
        run: |
          if [[ -f Github_Action_Benchmark.md ]]; then
            cat Github_Action_Benchmark.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Github_Action_Benchmark.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Github_Action_Benchmark
          path: |
            Github_Action_Benchmark.md
            throughput.log
            compare.log
            concurrency.log
            interop.log
            network.log
            fuzz.log
            h3.log
          if-no-files-found: error

  publish-report:
    name: Publish benchmark report
    needs: bench
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.bench.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download generated report
        uses: actions/download-artifact@v4
        with:
          name: Github_Action_Benchmark
          path: .benchmark-report
      - name: Commit benchmark report
        shell: bash
        run: |
          report=$(find .benchmark-report -type f -name 'Github_Action_Benchmark.md' -print -quit)
          if [[ -z "$report" ]]; then
            echo "Generated report was not found in the artifact" >&2
            exit 1
          fi
          cp "$report" Github_Action_Benchmark.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Github_Action_Benchmark.md
          if git diff --cached --quiet; then
            echo "Benchmark report is unchanged"
            exit 0
          fi
          git commit -m "Update benchmark evidence report"
          git push origin HEAD:main
