# Push README.md / README_CN.md to the repository wiki on every main
# update that touches them.
#
# The wiki is a separate git repo (<owner>/<repo>.wiki); the workflow
# checks it out, maps README.md -> Home.md (the wiki landing page) and
# README_CN.md -> a dedicated page, then commits and pushes.
#
# Push auth: the automatic GITHUB_TOKEN can write to the wiki as long as
# `contents: write` is granted (it is below). If your fork/org blocks
# that, create a fine-grained PAT with "Read and write" access to the
# wiki and store it as the GH_PAT secret — the token expression falls
# back to it automatically.

name: Wiki Sync

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'README_CN.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync READMEs → wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Copy READMEs into the wiki
        run: |
          cp repo/README.md wiki/Home.md
          cp repo/README_CN.md wiki/README_CN.md

      - name: Commit and push
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes; nothing to push"
            exit 0
          fi
          git commit -m "Sync READMEs from main (${{ github.sha }})"
          git push
