name: TLS interop (OpenSSL / nginx)

# Courierust TLS vs mainstream independent stacks (TLS 1.2 + 1.3 matrix):
#   A. Courierust client  -> OpenSSL s_server (TLS 1.3 / 1.2, h1)
#   B. Courierust server  <- curl / s_client  (TLS 1.3 / 1.2, h1+h2, ALPN)
#   C. Courierust h2 client -> nginx          (TLS 1.3 / 1.2)
# scripts/tls_interop.sh generates a throwaway CA + leaf — no network needed.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tls-interop.yml'
      - 'scripts/tls_interop.sh'
      - 'benches/src/tls_interop.rs'
      - 'benches/src/network.rs'
      - 'src/courierust_tls/**'
      - 'src/courierust_net/**'
      - 'src/courierust_client/**'
      - 'src/courierust_server/**'
  pull_request:
    paths:
      - '.github/workflows/tls-interop.yml'
      - 'scripts/tls_interop.sh'
      - 'benches/src/tls_interop.rs'
      - 'benches/src/network.rs'
      - 'src/courierust_tls/**'
      - 'src/courierust_net/**'
      - 'src/courierust_client/**'
      - 'src/courierust_server/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tls-interop:
    name: Real TLS stack interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - name: Install nginx (for the HTTP/2 over TLS case)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          nginx -v
      # Build-only: executing the benches would run `network` client mode,
      # which panics without a target URL. Binaries land in
      # target/release/deps/<name>-<hash>; the script locates them.
      - name: Build the interop binaries (release)
        run: cargo bench --manifest-path benches/Cargo.toml --locked --bench tls_interop --bench network --no-run
      - name: Run TLS interop (OpenSSL s_server, curl, s_client, nginx)
        shell: bash
        run: |
          set -o pipefail
          bash scripts/tls_interop.sh benches/target/release tls_interop.log
        env:
          OPENSSL: openssl
          CURL: curl
          NGINX: nginx
      - name: Publish TLS interop evidence to the run summary
        if: always()
        shell: bash
        run: |
          if [[ ! -f tls_interop.log ]]; then
            exit 0
          fi
          {
            echo "## TLS Interop Matrix (TLS 1.2 + 1.3)"
            echo
            echo '| Direction | Peer | TLS | Protocol | Status | Detail |'
            echo '| --- | --- | --- | --- | --- | --- |'
            awk -F'|' '/^TLSINTEROP\|role=/ {
              role=peer=tls=proto=status=detail="-"
              for (i=2; i<=NF; i++) {
                split($i, kv, "=")
                if (kv[1]=="role") role=kv[2]
                else if (kv[1]=="peer") peer=kv[2]
                else if (kv[1]=="tls") tls=kv[2]
                else if (kv[1]=="protocol") proto=kv[2]
                else if (kv[1]=="status") status=kv[2]
                else if (kv[1]=="http") detail="http=" kv[2]
                else if (kv[1]=="negotiated") detail="negotiated=" kv[2]
                else if (kv[1]=="saw") detail=$i
              }
              gsub(/\|/, "\\|", detail)
              printf "| %s | %s | %s | %s | %s | %s |\n", role, peer, tls, proto, status, detail
            }' tls_interop.log
            echo
            echo "### Raw TLSINTEROP log"
            echo '~~~text'
            cat tls_interop.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload TLS interop log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-interop-log
          path: tls_interop.log
          if-no-files-found: warn
