name: Fuzz (long-running)

# Deep fuzz runs: instead of a fixed run count, each target gets a time
# budget of wall-clock fuzzing so the h1 parser, the h2 state machine and
# the HPACK/Huffman codecs are explored far beyond what a PR-time smoke
# run covers. Failures abort the job (a crash anywhere is a release
# blocker). Runs on demand and nightly.

on:
  workflow_dispatch:
    inputs:
      minutes_per_target:
        description: 'Wall-clock minutes per fuzz target (deep runs: 30-120; CI smoke stays at 20 s in benchmark.yml)'
        required: false
        default: '30'
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Long fuzz (${{ inputs.minutes_per_target || 30 }}m/target)
    runs-on: ubuntu-latest
    # 4 targets x up to 120 min each, plus toolchain install + corpus
    # commit. GitHub's max job timeout is 360 minutes.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz all targets with a time budget
        shell: bash
        env:
          MINUTES: ${{ inputs.minutes_per_target || '30' }}
        run: |
          set -euo pipefail
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]] || [[ "$MINUTES" -lt 30 || "$MINUTES" -gt 120 ]]; then
            echo "minutes_per_target must be between 30 and 120" >&2
            exit 2
          fi
          failures=0
          for target in h2_frame hpack_block h1_request h2_connection; do
            echo "=== fuzzing $target for ${MINUTES} minutes ==="
            started=$(date +%s)
            # `-max_total_time` is the libFuzzer time budget; the run
            # aborts non-zero on any crash/leak/hang in the target.
            set +e
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- \
              -max_total_time="$((MINUTES * 60))" -max_len=16384 \
              -timeout=10 -rss_limit_mb=2048
            status=$?
            set -e
            duration=$(( $(date +%s) - started ))
            if [[ "$status" -eq 0 ]]; then
              result=ok
            else
              result=failed
              failures=1
            fi
            echo "FUZZ|target=$target|status=$result|runs=wall_clock|duration_s=$duration|budget_min=${MINUTES}|corpus=fuzz/corpus/$target|reason=command_exit_$status" | tee -a fuzz.log
          done
          # Fresh inputs discovered during the runs are committed back to
          # the corpus only when the whole job passes (corpus growth is
          # the point of long fuzzing).
          git status --short fuzz/corpus || true
          exit "$failures"
      - name: Upload fuzz logs + corpus diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-long
          path: |
            fuzz.log
            fuzz/corpus/**/*.bin
          if-no-files-found: warn
