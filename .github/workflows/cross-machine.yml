name: Cross-machine benchmark

# Loopback-vs-real-network evidence for HTTP/1 and HTTP/2, run from
# *separate physical machines*.
#
# A hosted runner produces the loopback baseline (server and client on
# one host, 127.0.0.1). The cross-machine cases use two self-hosted
# runners that must be on separate machines, registered with the labels
# `courierust-server` and `courierust-client`:
#
#   - The `courierust-server` runner binds a plain h1 server on
#     0.0.0.0:18080 and an h2 server on 0.0.0.0:18081, and keeps them up
#     while the client benchmarks.
#   - The `courierust-client` runner targets
#     `http://<server_host>:18080` / `:18081`.
#
# Dispatch this workflow with the server runner's IP as the
# `server_host` input (the two benchmark ports must be reachable from the
# client machine). Comparing the `NETWORK|role=client|...` rows from the
# loopback job and the cross-machine job isolates what is protocol-stack
# cost (identical binaries, identical settings — only the network path
# differs).

on:
  workflow_dispatch:
    inputs:
      server_host:
        description: 'IP of the courierust-server self-hosted runner (benchmark ports 18080/18081 must be open to it)'
        required: false
      requests:
        description: 'Requests per case'
        required: false
        default: '10000'
      payload:
        description: 'Response payload bytes'
        required: false
        default: '4096'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  loopback-baseline:
    name: Loopback baseline (hosted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - name: Build benches (release)
        run: cargo bench --manifest-path benches/Cargo.toml --locked --no-run
      - name: Server + client on one host (127.0.0.1)
        shell: bash
        env:
          REQS: ${{ inputs.requests || '10000' }}
          PAYLOAD: ${{ inputs.payload || '4096' }}
        run: |
          set -euo pipefail
          DIR="$PWD/benches/target/release"
          COURIERUST_NETWORK_ROLE=server COURIERUST_NETWORK_BIND=127.0.0.1:18090 \
            COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" "$DIR/network" > loop_h1.log 2>&1 &
          H1=$!
          COURIERUST_NETWORK_ROLE=server COURIERUST_NETWORK_BIND=127.0.0.1:18091 \
            COURIERUST_NETWORK_HTTP2=1 COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" "$DIR/network" > loop_h2.log 2>&1 &
          H2=$!
          # HTTPS server using the committed self-signed test identity.
          COURIERUST_NETWORK_ROLE=server COURIERUST_NETWORK_BIND=127.0.0.1:18092 \
            COURIERUST_NETWORK_HTTP2=1 COURIERUST_NETWORK_TLS=1 \
            COURIERUST_NETWORK_CERT_DER="$PWD/tests/certs/server_cert.der" \
            COURIERUST_NETWORK_KEY_DER="$PWD/tests/certs/server_key.der" \
            COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" "$DIR/network" > loop_https.log 2>&1 &
          HTTPS=$!
          # Rate-limited server: 1 Mbit/s response cap + 40 ms per-request
          # latency, simulating a constrained WAN link in-process.
          COURIERUST_NETWORK_ROLE=server COURIERUST_NETWORK_BIND=127.0.0.1:18093 \
            COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" \
            COURIERUST_NETWORK_THROTTLE_BPS=125000 COURIERUST_NETWORK_LATENCY_MS=40 \
            "$DIR/network" > loop_throttle.log 2>&1 &
          THROTTLE=$!
          sleep 1
          echo "=== LOOPBACK h1 ==="
          COURIERUST_NETWORK_URL=http://127.0.0.1:18090/ COURIERUST_NETWORK_PROTOCOL=h1 \
            COURIERUST_NETWORK_WORKERS=8 COURIERUST_NETWORK_MAX_CONNECTIONS=8 \
            COURIERUST_NETWORK_REQUESTS="$REQS" COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" \
            "$DIR/network"
          echo "=== LOOPBACK h2 ==="
          COURIERUST_NETWORK_URL=http://127.0.0.1:18091/ COURIERUST_NETWORK_PROTOCOL=h2 \
            COURIERUST_NETWORK_WORKERS=8 COURIERUST_NETWORK_MAX_CONNECTIONS=1 \
            COURIERUST_NETWORK_REQUESTS="$REQS" COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" \
            "$DIR/network"
          echo "=== LOOPBACK HTTPS+h2 (TLS 1.3) ==="
          COURIERUST_NETWORK_URL=https://127.0.0.1:18092/ COURIERUST_NETWORK_PROTOCOL=https-h2 \
            COURIERUST_NETWORK_WORKERS=4 COURIERUST_NETWORK_MAX_CONNECTIONS=1 \
            COURIERUST_NETWORK_ROOT_DER="$PWD/tests/certs/server_cert.der" \
            COURIERUST_NETWORK_REQUESTS="$REQS" COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" \
            "$DIR/network"
          echo "=== LOOPBACK h1 THROTTLED (1 Mbit/s cap, 40 ms RTT) ==="
          COURIERUST_NETWORK_URL=http://127.0.0.1:18093/ COURIERUST_NETWORK_PROTOCOL=h1 \
            COURIERUST_NETWORK_WORKERS=1 COURIERUST_NETWORK_MAX_CONNECTIONS=1 \
            COURIERUST_NETWORK_REQUESTS=500 COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" \
            COURIERUST_NETWORK_TAG=throttled-1mbit-40ms \
            "$DIR/network"
          kill "$H1" "$H2" "$HTTPS" "$THROTTLE" 2>/dev/null || true
          wait "$H1" 2>/dev/null || true
          wait "$H2" 2>/dev/null || true
          wait "$HTTPS" 2>/dev/null || true
          wait "$THROTTLE" 2>/dev/null || true

  cross-server:
    name: Cross-machine server (self-hosted)
    if: github.event_name == 'workflow_dispatch' && inputs.server_host != ''
    runs-on: [self-hosted, courierust-server]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build benches (release)
        run: cargo bench --manifest-path benches/Cargo.toml --locked --no-run
      - name: Serve h1 + h2 + https + throttled on 0.0.0.0
        shell: bash
        env:
          PAYLOAD: ${{ inputs.payload || '4096' }}
        run: |
          set -euo pipefail
          DIR="$PWD/benches/target/release"
          COURIERUST_NETWORK_ROLE=server COURIERUST_NETWORK_BIND=0.0.0.0:18080 \
            COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" "$DIR/network" > cross_h1.log 2>&1 &
          H1=$!
          COURIERUST_NETWORK_ROLE=server COURIERUST_NETWORK_BIND=0.0.0.0:18081 \
            COURIERUST_NETWORK_HTTP2=1 COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" "$DIR/network" > cross_h2.log 2>&1 &
          H2=$!
          COURIERUST_NETWORK_ROLE=server COURIERUST_NETWORK_BIND=0.0.0.0:18082 \
            COURIERUST_NETWORK_HTTP2=1 COURIERUST_NETWORK_TLS=1 \
            COURIERUST_NETWORK_CERT_DER="$PWD/tests/certs/server_cert.der" \
            COURIERUST_NETWORK_KEY_DER="$PWD/tests/certs/server_key.der" \
            COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" "$DIR/network" > cross_https.log 2>&1 &
          HTTPS=$!
          COURIERUST_NETWORK_ROLE=server COURIERUST_NETWORK_BIND=0.0.0.0:18083 \
            COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" \
            COURIERUST_NETWORK_THROTTLE_BPS=125000 COURIERUST_NETWORK_LATENCY_MS=40 \
            "$DIR/network" > cross_throttle.log 2>&1 &
          THROTTLE=$!
          echo "cross-machine servers listening on 18080 (h1), 18081 (h2), 18082 (https+h2), 18083 (throttled h1)"
          # Keep serving while the client job benchmarks against us.
          sleep 1200
          kill "$H1" "$H2" "$HTTPS" "$THROTTLE" 2>/dev/null || true
          wait "$H1" 2>/dev/null || true
          wait "$H2" 2>/dev/null || true
          wait "$HTTPS" 2>/dev/null || true
          wait "$THROTTLE" 2>/dev/null || true
          echo "cross-machine server finished"
          cat cross_h1.log cross_h2.log cross_https.log cross_throttle.log

  cross-client:
    name: Cross-machine client (self-hosted)
    if: github.event_name == 'workflow_dispatch' && inputs.server_host != ''
    runs-on: [self-hosted, courierust-client]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build benches (release)
        run: cargo bench --manifest-path benches/Cargo.toml --locked --no-run
      - name: Benchmark the remote server
        shell: bash
        env:
          SERVER_HOST: ${{ inputs.server_host }}
          REQS: ${{ inputs.requests || '10000' }}
          PAYLOAD: ${{ inputs.payload || '4096' }}
        run: |
          set -euo pipefail
          DIR="$PWD/benches/target/release"
          HOST="${SERVER_HOST%%:*}"
          # Wait for the remote servers to come up (the server job starts
          # in parallel with this one).
          for port in 18080 18081 18082 18083; do
            ok=0
            for _ in $(seq 1 300); do
              if (exec 3<>"/dev/tcp/$HOST/$port") 2>/dev/null; then
                exec 3>&- 3<&- 2>/dev/null || true
                ok=1
                break
              fi
              sleep 1
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "::error::remote server not reachable on $HOST:$port" >&2
              exit 1
            fi
          done
          echo "=== CROSS-MACHINE h1 (server_host=$HOST) ==="
          COURIERUST_NETWORK_URL="http://$HOST:18080/" COURIERUST_NETWORK_PROTOCOL=h1 \
            COURIERUST_NETWORK_WORKERS=8 COURIERUST_NETWORK_MAX_CONNECTIONS=8 \
            COURIERUST_NETWORK_REQUESTS="$REQS" COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" \
            "$DIR/network"
          echo "=== CROSS-MACHINE h2 ==="
          COURIERUST_NETWORK_URL="http://$HOST:18081/" COURIERUST_NETWORK_PROTOCOL=h2 \
            COURIERUST_NETWORK_WORKERS=8 COURIERUST_NETWORK_MAX_CONNECTIONS=1 \
            COURIERUST_NETWORK_REQUESTS="$REQS" COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" \
            "$DIR/network"
          echo "=== CROSS-MACHINE HTTPS+h2 (TLS 1.3) ==="
          COURIERUST_NETWORK_URL="https://$HOST:18082/" COURIERUST_NETWORK_PROTOCOL=https-h2 \
            COURIERUST_NETWORK_WORKERS=4 COURIERUST_NETWORK_MAX_CONNECTIONS=1 \
            COURIERUST_NETWORK_ROOT_DER="$PWD/tests/certs/server_cert.der" \
            COURIERUST_NETWORK_REQUESTS="$REQS" COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" \
            "$DIR/network"
          echo "=== CROSS-MACHINE h1 THROTTLED (1 Mbit/s cap, 40 ms RTT) ==="
          COURIERUST_NETWORK_URL="http://$HOST:18083/" COURIERUST_NETWORK_PROTOCOL=h1 \
            COURIERUST_NETWORK_WORKERS=1 COURIERUST_NETWORK_MAX_CONNECTIONS=1 \
            COURIERUST_NETWORK_REQUESTS=500 COURIERUST_NETWORK_PAYLOAD="$PAYLOAD" \
            COURIERUST_NETWORK_TAG=throttled-1mbit-40ms \
            "$DIR/network"

  publish-summary:
    name: Publish cross-machine summary
    needs: [loopback-baseline, cross-client]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: |
          echo "The loopback and cross-machine NETWORK rows above are the
          same-binary, same-settings comparison. Any rps/p99 gap between
          them is the cost of the real network path, not the protocol
          stack." >> "$GITHUB_STEP_SUMMARY"
