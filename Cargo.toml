[package]
name = "courierust"
version = "1.0.9"
edition = "2021"
rust-version = "1.78"
license-file = "LICENSE"
authors = ["blueokanna", "HyphenTeam"]
description = "A zero-dependency, self-contained HTTP/1.1 + HTTP/2 + HTTP/3 (QUIC) + WebSocket + gRPC stack with a from-scratch TLS 1.2/1.3, a work-stealing scheduler, RFC 9218 priority and JA3/JA4 fingerprints."
documentation = "https://docs.rs/courierust"
homepage = "https://github.com/blueokanna/Courierust"
repository = "https://github.com/blueokanna/Courierust"
readme = "README.md"
keywords = ["http2", "network", "client", "no-std", "multicore"]
categories = [
    "network-programming",
    "web-programming::http-client",
    "web-programming::http-server",
]

exclude = [
    "**/target",
    "**/*.log",
    "**/*.err",
    "blogs/**",
    "scripts/**",
    ".github/**",
    ".vscode/**",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = []

[dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
