[package]
name = "courierust"
version = "1.0.7"
edition = "2021"
rust-version = "1.78"
license-file = "LICENSE"
authors = ["blueokanna", "HyphenTeam"]
description = "A bare-metal no_std HTTP and gRPC engine with work-stealing, RFC 9218, and JA3/JA4 fingerprinting."
homepage = "https://github.com/blueokanna/Courierust"
repository = "https://github.com/blueokanna/Courierust"
readme = "README.md"
keywords = ["http2", "network", "client", "no-std", "multicore"]
categories = [
    "network-programming",
    "web-programming::http-client",
    "web-programming::http-server",
]
exclude = ["**/target", "**/*.log", "**/*.err", "blogs/**"]

[features]
default = ["std"]
std = []

[dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
